<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" >
</head>
<body>
  <!-- General cotnainer -->
  <div class="flex justify-center items-center min-h-screen p-2">

    <!-- Modal -->
     <div class="flex flex-col gap-3.5 items-center md:flex-row max-w-4/5 p-5 rounded-xl shadow shadow-gray-500">
      
      <!-- Imgae -->
      <img
        class="w-40 h-40"
        src="./images/headphone.png"
        alt="Headphone"
      />

      <!-- Text column -->
      <div class="flex flex-col p-4">

        <!-- Badge -->
        <p class="p-2 rounded-full bg-black text-white self-center text-xs md:self-start">
          Free shipping
        </p>

        <!-- Title -->
        <h3 class="mt-3 text-center font-bold">
          Razer Kraken Kitty Edit Gaming Headset Quartz
        </h3>

        <!-- Prev price -->
        <p class="mt-5 text-gray-600 line-through text-xs text-center md:text-left">
          $799
        </p>

        <!-- Current price -->
        <h2 class="mt-2 text-4xl font-bold text-center md:text-left">
          $599
        </h2>

        <!-- Conditions -->
        <p class="mt-2 text-gray-500 text-xs text-center md:text-left">
          The offer is valid until April 5 or as long as stock lasts
        </p>

        <!-- CTA button -->
        <button class="w-full mt-2 p-2 duration-150 text-sm shadow-blue-700 shadow-button  outline- text-white bg-blue-500 rounded-lg   hover:bg-blue-700 hover:shadow-none hover:translate-y-1">
          Add to cart
        </button>

        <!-- Stock -->
        <p class="flex items-center mt-4 group">
          <span class="w-3 h-3 mr-1 rounded-full bg-green-700 group-hover:animate-ping"></span>
          <span class="text-gray-600 text-xs">50+ pcs. in stock</span>
        </p>

        <!-- Buttons container -->
         <div class="flex flex-col gap-2 mt-3 md:flex-row">

          <button class="flex items-center justify-center border-1 p-3 border-gray-600 rounded cursor-pointer">
            <img
              src="./images//weight.png"
              alt="Add to cart"
              class="w-5 h-5 mr-3"
            />
            <span class="text-xs">Add to cart</span>
          </button>
        

          <button class="flex items-center justify-center border-1 p-3 border-gray-600 rounded cursor-pointer">
            <img
              src="./images/heart.png"
              alt="Add to cart"
              class="w-5 h-5 mr-3"
            />
            <span class="text-xs">Add to whishlist</span>
          </button>

         </div>

      </div>

     </div>

  </div>
</body>
</html>
